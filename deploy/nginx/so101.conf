# Единственная входная точка стенда: сайт, API, WebSocket и видео — один origin.
#
# Монтируется в /etc/nginx/conf.d/default.conf, то есть попадает в контекст http
# штатного nginx.conf из образа. Отсюда `map` на верхнем уровне файла — он http-уровня.
#
# ПОЧЕМУ ВСЁ НА ОДНОМ ПОРТУ. MJPEG показывается обычным <img src>. Картинка с
# чужого origin — это уже CORS, и `web_video_server` отдаёт `Access-Control-Allow-Origin: *`,
# но за туннелем добавляется ещё и mixed content: страница по HTTPS не покажет
# поток по http://<ip>:8081. Плюс телефон посетителя не знает никаких портов,
# кроме того, что зашит в QR. Поэтому фронтенд ходит только относительными
# путями, а раскладывает их nginx.
#
# Имя `ros` — это имя сервиса из compose-файла. Шлюз и web_video_server живут
# в СЕТЕВОМ ПРОСТРАНСТВЕ этого контейнера (network_mode: service:ros), поэтому
# оба доступны по нему: 8080 — шлюз, 8081 — видео.

map $http_upgrade $so101_connection {
    default upgrade;
    ''      close;
}

# Схема, как её видел клиент. За cloudflared соединение до nginx идёт по http,
# и без этой подстановки шлюз снял бы флаг Secure с cookie сессии
# (gateway/so101_gateway/rest.py смотрит именно на X-Forwarded-Proto).
map $http_x_forwarded_proto $so101_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Встроенный DNS Docker. Нужен потому, что адреса ниже подставляются
    # переменными: без переменной nginx резолвит имя ОДИН раз при старте и
    # намертво кэширует адрес — после `docker compose restart ros` контейнер
    # получает новый IP, и весь стенд отвечает 502 до перезапуска nginx.
    # С переменной + resolver имя перечитывается каждые 10 с.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $so101_gateway "ros:8080";
    set $so101_video   "ros:8081";

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # model/gltf-binary — это arm.glb, и он крупнейший файл первой загрузки.
    # Меш уже ужат gltfpack, но gzip снимает с него ещё треть: 275 → 178 КБ.
    gzip_types text/css application/javascript application/json image/svg+xml
               model/gltf-binary;
    # Уровень по умолчанию у nginx — 1, самый быстрый и самый слабый. Здесь
    # сжимается горстка статических файлов на каждого посетителя, а не поток,
    # поэтому процессор не жаль: 5 снимает со сцены three.js ещё 32 КБ
    # (202 → 170), а дальше прирост уже незаметен.
    gzip_comp_level 5;
    gzip_min_length 1024;

    # Проверка живости самого nginx, не трогает ни шлюз, ни ROS.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── REST шлюза ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://$so101_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $so101_scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────
    # Без Upgrade/Connection апгрейд не состоится, и фронтенд будет
    # бесконечно переподключаться с кодом 1006.
    location /ws {
        proxy_pass http://$so101_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $so101_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $so101_scheme;

        proxy_buffering off;          # состояние идёт 10 Гц, буфер — это лаг
        proxy_read_timeout 3600s;     # молчание клиента ловит watchdog шлюза,
        proxy_send_timeout 3600s;     # а не таймаут nginx
    }

    # ── Видео ─────────────────────────────────────────────────────────────
    # `/video/stream` — ровно тот адрес, который шлюз отдаёт в GET /api/config
    # полем video_url. Топик подставляется здесь, чтобы фронтенд не знал имён
    # ROS-топиков: сменится камера — правится одна строка, контракт цел.
    #
    # rewrite ... break вместо proxy_pass с готовым URI: так гарантированно
    # отбрасывается собственная строка запроса клиента (фронтенд добавляет
    # ?r=N при переподключении, и она склеилась бы с именем топика).
    location = /video/stream {
        # Качество подставляется на старте контейнера (envsubst в штатном
        # entrypoint nginx, см. SO101_VIDEO_QUALITY в compose). Через модем
        # его снижают: 70 → 50 срезает поток примерно на четверть.
        rewrite ^ /stream?topic=/static_camera/image_raw&quality=${SO101_VIDEO_QUALITY}? break;
        proxy_pass http://$so101_video;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Главное для MJPEG: поток бесконечный, буферизация превращает его
        # в «картинка появляется через минуту» или не появляется вовсе.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    # Остальное хозяйство web_video_server: /video/snapshot, /video/stream_viewer,
    # /video/ (список топиков) — удобно при отладке на стенде.
    location /video/ {
        rewrite ^/video/(.*)$ /$1 break;
        proxy_pass http://$so101_video;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /video {
        return 301 /video/;
    }

    # ── Статика фронтенда ────────────────────────────────────────────────
    # Имена файлов в assets/ содержат хэш содержимого, поэтому кэшируются
    # навсегда; index.html — никогда, иначе телефон посетителя останется на
    # прошлой сборке и будет дёргать несуществующие чанки.
    # ── Экран у стенда ────────────────────────────────────────────────────
    # Отдельная страница для монитора рядом с рукой: видео во весь экран.
    # Лежит ВНЕ каталога сайта — внутрь него не смонтировать, он подключён
    # только для чтения. Отсюда alias вместо root.
    #
    # Наружу не выходит: ретранслятор отдаёт на /screen/* 404. Страница
    # тянет /video/stream, который через туннель тоже закрыт, — смысл имеет
    # только в локальной сети.
    location /screen/ {
        alias /usr/share/nginx/screen/;
        index index.html;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 3D-модель руки: 275 КБ, меняется только при пересборке из URDF.
    # Имя без хэша (её грузит ArmScene по фиксированному пути), поэтому
    # кэшируем не «навсегда», а на сутки — иначе после пересборки модели
    # телефон постоянного посетителя остался бы на старой геометрии.
    location = /arm.glb {
        # Только `expires` — он сам выставляет Cache-Control. Дополнительный
        # add_header дал бы ДВА заголовка Cache-Control в ответе.
        expires 1d;
        types { } default_type model/gltf-binary;
        try_files $uri =404;
    }

    # Роутер фронтенда клиентский (/ и /control), поэтому любой неизвестный
    # путь отдаёт index.html — иначе перезагрузка страницы /control даст 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
